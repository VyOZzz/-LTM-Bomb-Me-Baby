ne" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="955" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ACK (seq n)</text><path d="M600,1010 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="1001" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">STATE_UPDATE</text><path d="M600,1010 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="1001" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">STATE_UPDATE</text><circle cx="600" cy="1010" r="7" fill="#1f2933"/><rect x="320.0" y="1036" width="560" height="66" rx="8" fill="#f3ecfa" stroke="#7a4fb0" stroke-width="1.8"/><text x="600.0" y="1060" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">Mỗi 100 ms: snapshot riêng cho A và cho B,</text><text x="600.0" y="1084" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">B trong bụi thì snapshot gửi A không có tọa độ của B</text><path d="M1000,1140 H606" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="1131" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">CHARGE_START, EXPLODE</text><path d="M600,1186 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="1177" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PLAYER_EXPLODE …</text><path d="M600,1186 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="1177" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PLAYER_EXPLODE …</text><circle cx="600" cy="1186" r="7" fill="#1f2933"/><path d="M200,1232 H594" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="1223" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PING (mỗi 2 giây)</text><path d="M600,1278 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="1269" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PONG</text><rect x="20" y="1312" width="1160" height="34" rx="6" fill="#eef1f4" stroke="#eef1f4" stroke-width="1"/><text x="36" y="1336" text-anchor="start" font-size="18" font-weight="700" fill="#3e4c59">4. Kết thúc trận</text><path d="M600,1400 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="1391" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">GAME_OVER</text><path d="M600,1400 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="1391" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">GAME_OVER</text><circle cx="600" cy="1400" r="7" fill="#1f2933"/><path d="M600,1446 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="1437" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE</text><path d="M600,1446 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="1437" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE</text><circle cx="600" cy="1446" r="7" fill="#1f2933"/></svg>