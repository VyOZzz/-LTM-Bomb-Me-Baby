erId, resumeToken}</text><path d="M1000,314 H606" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="305" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">HELLO {name}</text><path d="M600,360 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="351" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">WELCOME {playerId, resumeToken}</text><rect x="20" y="394" width="1160" height="34" rx="6" fill="#eef1f4" stroke="#eef1f4" stroke-width="1"/><text x="36" y="418" text-anchor="start" font-size="18" font-weight="700" fill="#3e4c59">2. Vào phòng riêng</text><path d="M200,482 H594" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="473" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">CREATE_ROOM (seq 1)</text><path d="M600,528 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="519" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE (mã ABC123)</text><path d="M1000,574 H606" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="565" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">JOIN_ROOM (code ABC123)</text><path d="M600,620 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="611" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE</text><path d="M600,620 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="611" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE</text><circle cx="