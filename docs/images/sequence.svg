troke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="790.0" y="552" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">11: READY</text><path d="M593,602 H228" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="410.0" y="594" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">12: GAME_START(map, hình học)</text><path d="M607,644 H972" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="790.0" y="636" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">13: GAME_START(map, hình học)</text><path d="M640,668 H1046 L1060,682 V768 H640 Z" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><path d="M1046,668 V682 H1060" fill="none" stroke="#333333" stroke-width="1.3"/><text x="652" y="692" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">Ghép trận thay cho tạo/vào phòng:</text><text x="652" y="713" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">FIND_MATCH → MATCHMAKING → MATCH_FOUND</text><text x="652" y="734" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">→ ROOM_STATE → GAME_START, không cần READY</text><text x="652" y="755" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">(đủ 4 người, hoặc 2–3 người sau 15 giây)</text><path d="M227,834 H592" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="410.0" y="826" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">14: MOVE(direction, seq=n)</text><path d="M593,876 H228" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="8 5" marker-end="url(#open)"/><text x="410.0" y="868" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">15: ACK(seq=n)</text><path d="M607,910 H653 V936 H609" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="663" y="928" text-anchor="start" font-size="17" font-weight="400" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" fill="#1a1a1a">16: update(): game loop mỗi 50 ms</text><path d="M593,976 H228" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="410.0" y="968" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">17: STATE_UPDATE(snapshot cho A)</text><path d="M607,1018 H972" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="790.0" y="1010" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">18: STATE_UPDATE(snapshot cho B)</text><path d="M973,1060 H608" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="790.0" y="1052" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">19: EXPLODE(seq=m)</text><path d="M593,1102 H228" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="410.0" y="1094" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">20: PLAYER_EXPLODE</text><path d="M607,1144 H972" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="790.0" y="1136" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">21: PLAYER_EXPLODE</text><path d="M227,1186 H592" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="410.0" y="1178" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">22: PING(clientTime)</text><path d="M593,1228 H228" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="8 5" marker-end="url(#open)"/><text x="410.0" y="1220" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">23: PONG</text><rect x="70" y="784" width="1060" height="464" rx="0" fill="none" stroke="#333333" stroke-width="1.3"/><path d="M70,810 H128 L138,800 V784" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="78" y="803" text-anchor="start" font-size="16" font-weight="700" fill="#1a1a1a">loop</text><rect x="146" y="788" width="190.4