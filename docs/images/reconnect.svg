<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1244" viewBox="0 0 1200 1244" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="1200" height="1244" fill="#ffffff"/><line x1="1000" y1="100" x2="1000" y2="1224" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 6"/><line x1="600" y1="100" x2="600" y2="1224" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 6"/><line x1="200" y1="100" x2="200" y2="1224" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 6"/><rect x="70" y="30" width="260" height="62" rx="10" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2.5"/><text x="200" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">Client B (mất mạng)</text><rect x="470" y="30" width="260" height="62" rx="10" fill="#fdf1e3" stroke="#c77d1a" stroke-width="2.5"/><text x="600" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">Server</text><rect x="870" y="30" width="260" height="62" rx="10" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2.5"/><text x="1000" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">Client A (còn lại)</text><rect x="20" y="134" width="1160" height="34" rx="6" fill="#eef1f4" stroke="#eef1f4" stroke-width="1"/><text x="36" y="158" text-anchor="start" font-size="18" font-weight="700" fill="#3e4c59">1. Mất kết nối</text><line x1="200" y1="222" x2="440" y2="222" stroke="#1f2933" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M455,210 l24,24 M479,210 l-24,24" stroke="#c0392b" stroke-width="4"/><text x="320" y="212" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2933">kết nối TCP đứt</text><rect x="340.0" y="248" width="520" height="66" rx="8" fill="#fdf1e3" stroke="#c77d1a" stroke-width="1.8"/><text x="600.0" y="272" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">Server: đánh dấu B mất kết nối, dừng di chuyển,</text><text x="600.0" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">giữ chỗ 10 giây trong phòng</text><path d="M600,352 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="343" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE, PLAYER_DISCONNECTED</text><rect x="30" y="378" width="470" height="66" rx="8" fill="#e8f1fb" stroke="#3b73b9" stroke-width="1.8"/><text x="265.0" y="402" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">Client: lỗi đọc/ghi hoặc 7 giây không nhận gì;</text><text x="265.0" y="426" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">hiện đếm ngược, đợi 1,2 giây rồi mở socket mới</text><rect x="20" y="470" width="1160" height="34" rx="6" fill="#eef1f4" stroke="#eef1f4" stroke-width="1"/><text x="36" y="494" text-anchor="start" font-size="18" font-weight="700" fill="#3e4c59">2. Kết nối lại bằng resume token</text><path d="M200,558 H594" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="549" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">HELLO {resumeToken}</text><path d="M600,638 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="629" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">WELCOME {lastSeq}</text><path d="M600,684 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="675" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE</text><path d="M600,684 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="675" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ROOM_STATE</text><circle cx="600" cy="684" r="7" fill="#1f2933"/><path d="M600,730 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="721" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">STATE_UPDATE + hình học</text><path d="M600,776 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="767" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PLAYER_RECONNECTED</text><path d="M600,776 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="767" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PLAYER_RECONNECTED</text><circle cx="600" cy="776" r="7" fill="#1f2933"/><path d="M600,862 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="853" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">WELCOME, ROOM_STATE</text><path d="M600,908 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="899" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">STATE_UPDATE + GAME_OVER</text><path d="M600,994 H206" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="400.0" y="985" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">ERROR RESUME_FAILED</text><rect x="60" y="578" width="1080" height="440" rx="6" fill="none" stroke="#3e4c59" stroke-width="1.6" stroke-dasharray="7 5"/><path d="M60,608 H112 L124,596 V578" fill="#ffffff" stroke="#3e4c59" stroke-width="1.6"/><text x="70" y="600" text-anchor="start" font-size="17" font-weight="700" fill="#1f2933">alt</text><text x="136" y="600" text-anchor="start" font-size="17" font-weight="600" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" fill="#3e4c59">[phòng đang PLAYING]</text><line x1="60" y1="802" x2="1140" y2="802" stroke="#3e4c59" stroke-width="1.4" stroke-dasharray="7 5"/><text x="72" y="824" text-anchor="start" font-size="17" font-weight="600" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" fill="#3e4c59">[trận đã FINISHED]</text><line x1="60" y1="934" x2="1140" y2="934" stroke="#3e4c59" stroke-width="1.4" stroke-dasharray="7 5"/><text x="72" y="956" text-anchor="start" font-size="17" font-weight="600" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" fill="#3e4c59">[token sai, hết hạn hoặc đang được socket khác dùng]</text><rect x="20" y="1046" width="1160" height="34" rx="6" fill="#eef1f4" stroke="#eef1f4" stroke-width="1"/><text x="36" y="1070" text-anchor="start" font-size="18" font-weight="700" fill="#3e4c59">3. Quá 10 giây mà B chưa quay lại</text><rect x="340.0" y="1114" width="520" height="42" rx="8" fill="#fdf1e3" stroke="#c77d1a" stroke-width="1.8"/><text x="600.0" y="1138" text-anchor="middle" font-size="17" font-weight="400" fill="#1f2933">Game loop loại B khỏi trận (lý do disconnect)</text><path d="M600,1194 H994" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="800.0" y="1185" text-anchor="middle" font-size="18" font-weight="600" font-family="Consolas, monospace" fill="#1f2933">PLAYER_ELIMINATED</text></svg>