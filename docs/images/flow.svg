<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="1200" height="1000" fill="#ffffff"/><text x="285.0" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2933">UNITY CLIENT</text><text x="285.0" y="78" text-anchor="middle" font-size="17" font-weight="400" fill="#3e4c59">BombGame (main thread) + BombNetwork (2 luồng nền)</text><text x="935.0" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2933">JAVA SERVER</text><text x="935.0" y="78" text-anchor="middle" font-size="17" font-weight="400" fill="#3e4c59">BombServer + GameRoom</text><rect x="527" y="44" width="166" height="40" rx="20" fill="#ffffff" stroke="#3e4c59" stroke-width="1.5"/><text x="610" y="70" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2933">TCP · cổng 7777</text><rect x="70" y="110" width="430" height="104" rx="10" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2.5"/><circle cx="100" cy="140" r="17" fill="#3b73b9"/><text x="100" y="147" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text><text x="128" y="147" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Đọc input</text><text x="90" y="178" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">Update() đọc WASD, Space, E, Shift;</text><text x="90" y="204" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">dự đoán ngay vị trí nhân vật mình</text><rect x="70" y="244" width="430" height="104" rx="10" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2.5"/><circle cx="100" cy="274" r="17" fill="#3b73b9"/><text x="100" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text><text x="128" y="281" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Tạo request</text><text x="90" y="312" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">Send() gán seq tăng dần; MOVE gửi</text><text x="90" y="338" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">mỗi 40 ms; đưa JSON vào outbox</text><rect x="70" y="378" width="430" height="104" rx="10" fill="#fdf1e3" stroke="#c77d1a" stroke-width="2.5"/><circle cx="100" cy="408" r="17" fill="#c77d1a"/><text x="100" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text><text x="128" y="415" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Luồng ghi client</text><text x="90" y="446" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">lấy message khỏi outbox, ghi</text><text x="90" y="472" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">một dòng JSON vào socket</text><rect x="720" y="110" width="430" height="104" rx="10" fill="#fdf1e3" stroke="#c77d1a" stroke-width="2.5"/><circle cx="750" cy="140" r="17" fill="#c77d1a"/><text x="750" y="147" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text><text x="778" y="147" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Luồng đọc của kết nối</text><text x="740" y="178" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">readFrame ≤ 2048 ký tự, parse JSON;</text><text x="740" y="204" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">seq ≤ lastSeq → DUPLICATE_SEQUENCE</text><rect x="720" y="244" width="430" height="104" rx="10" fill="#e9f6ec" stroke="#2f8a46" stroke-width="2.5"/><circle cx="750" cy="274" r="17" fill="#2f8a46"/><text x="750" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">5</text><text x="778" y="281" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">GameRoom.action()</text><text x="740" y="312" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">dưới khóa phòng: chỉ ghi hướng dx, dz;</text><text x="740" y="338" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">trả ACK(seq, processingMicros)</text><rect x="720" y="378" width="430" height="104" rx="10" fill="#e9f6ec" stroke="#2f8a46" stroke-width="2.5"/><circle cx="750" cy="408" r="17" fill="#2f8a46"/><text x="750" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">6</text><text x="778" y="415" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Game loop, mỗi 50 ms</text><text x="740" y="446" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">di chuyển, va chạm, nhặt đồ, nổ bom,</text><text x="740" y="472" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">kết thúc trận; event gửi ngay</text><rect x="720" y="512" width="430" height="104" rx="10" fill="#f3ecfa" stroke="#7a4fb0" stroke-width="2.5"/><circle cx="750" cy="542" r="17" fill="#7a4fb0"/><text x="750" y="549" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">7</text><text x="778" y="549" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Snapshot, mỗi 100 ms</text><text x="740" y="580" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">riêng cho từng người xem, lọc theo</text><text x="740" y="606" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">SyncMode; gắn roomCode, roundIndex</text><rect x="720" y="646" width="430" height="104" rx="10" fill="#fdf1e3" stroke="#c77d1a" stroke-width="2.5"/><circle cx="750" cy="676" r="17" fill="#c77d1a"/><text x="750" y="683" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">8</text><text x="778" y="683" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Hàng đợi ghi + luồng ghi</text><text x="740" y="714" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">≤ 128 message; chỉ gộp 2 snapshot</text><text x="740" y="740" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">liền nhau; ghi socket ngoài khóa</text><rect x="70" y="512" width="430" height="104" rx="10" fill="#fdf1e3" stroke="#c77d1a" stroke-width="2.5"/><circle cx="100" cy="542" r="17" fill="#c77d1a"/><text x="100" y="549" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">9</text><text x="128" y="549" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Luồng đọc client</text><text x="90" y="580" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">ReadLine() rồi đưa vào inbox</text><text x="90" y="606" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">(gộp snapshot liền nhau, ≤ 256)</text><rect x="70" y="646" width="430" height="104" rx="10" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2.5"/><circle cx="100" cy="676" r="17" fill="#3b73b9"/><text x="100" y="683" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">10</text><text x="128" y="683" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Xử lý message</text><text x="90" y="714" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">bỏ snapshot sai roomCode, roundIndex</text><text x="90" y="740" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">hoặc PLAYING sau khi đã FINISHED</text><rect x="70" y="780" width="430" height="104" rx="10" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2.5"/><circle cx="100" cy="810" r="17" fill="#3b73b9"/><text x="100" y="817" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">11</text><text x="128" y="817" text-anchor="start" font-size="22" font-weight="700" fill="#1f2933">Hiển thị</text><text x="90" y="848" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">kéo nhân vật mình về vị trí server,</text><text x="90" y="874" text-anchor="start" font-size="19" font-weight="400" fill="#3e4c59">nội suy đối thủ, ẩn visible=false, HUD</text><path d="M285.0,214 V240" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M285.0,348 V374" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M285.0,616 V642" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M285.0,750 V776" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M935.0,214 V240" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M935.0,348 V374" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M935.0,482 V508" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M935.0,616 V642" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><path d="M500,430 H530 V162 H716" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="542" y="274" text-anchor="start" font-size="17" font-weight="400" font-style="italic" fill="#1f2933">MOVE,</text><text x="542" y="296" text-anchor="start" font-size="17" font-weight="400" font-style="italic" fill="#1f2933">CHARGE_START,</text><text x="542" y="318" text-anchor="start" font-size="17" font-weight="400" font-style="italic" fill="#1f2933">EXPLODE, PING…</text><path d="M720,698 H690 V564 H504" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="680" y="604" text-anchor="end" font-size="17" font-weight="400" font-style="italic" fill="#1f2933">STATE_UPDATE,</text><text x="680" y="626" text-anchor="end" font-size="17" font-weight="400" font-style="italic" fill="#1f2933">event, ACK,</text><text x="680" y="648" text-anchor="end" font-size="17" font-weight="400" font-style="italic" fill="#1f2933">PONG</text><path d="M70,832 H32 V162 H66" fill="none" stroke="#1f2933" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#head)"/><text x="22" y="497.0" font-size="17" font-style="italic" fill="#1f2933" text-anchor="middle" transform="rotate(-90 22 497.0)">khung hình kế tiếp</text><rect x="70" y="930" width="26" height="26" rx="5" fill="#e8f1fb" stroke="#3b73b9" stroke-width="2"/><text x="106" y="950" text-anchor="start" font-size="18" font-weight="400" fill="#3e4c59">Main thread Unity</text><rect x="309.2" y="930" width="26" height="26" rx="5" fill="#fdf1e3" stroke="#c77d1a" stroke-width="2"/><text x="345.2" y="950" text-anchor="start" font-size="18" font-weight="400" fill="#3e4c59">Luồng mạng (đọc, ghi)</text><rect x="586.8" y="930" width="26" height="26" rx="5" fill="#e9f6ec" stroke="#2f8a46" stroke-width="2"/><text x="622.8" y="950" text-anchor="start" font-size="18" font-weight="400" fill="#3e4c59">Xử lý trận dưới khóa phòng</text><rect x="912.4" y="930" width="26" height="26" rx="5" fill="#f3ecfa" stroke="#7a4fb0" stroke-width="2"/><text x="948.4" y="950" text-anchor="start" font-size="18" font-weight="400" fill="#3e4c59">Đồng bộ chọn lọc</text></svg>