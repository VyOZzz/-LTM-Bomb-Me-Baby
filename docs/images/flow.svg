<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1420" viewBox="0 0 1400 1420" font-family="Arial, Helvetica, sans-serif"><defs><marker id="open" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#333333" stroke-width="1.6"/></marker></defs><rect width="1400" height="1420" fill="#ffffff"/><rect x="20" y="20" width="1360" height="1380" rx="0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><rect x="20" y="20" width="670" height="46" rx="0" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/><rect x="690" y="20" width="690" height="46" rx="0" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/><line x1="690" y1="20" x2="690" y2="1400" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Unity Client</text><text x="1035.0" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Java Server</text><circle cx="300" cy="100" r="12" fill="#1a1a1a"/><path d="M300,112 V136" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><path d="M300,138 L322,160 L300,182 L278,160 Z" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><path d="M300,182 V203" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="100.0" y="205" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300" y="232" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">1. Đọc input (WASD, Space, E, Shift),</text><text x="300" y="254" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">dự đoán vị trí nhân vật của mình</text><path d="M300,269 V293" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="100.0" y="295" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300" y="322" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">2. Send(): gán seq tăng dần, đưa</text><text x="300" y="344" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">MOVE vào outbox (mỗi 40 ms)</text><path d="M300,359 V383" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="100.0" y="385" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300" y="412" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">3. Luồng ghi client ghi một dòng</text><text x="300" y="434" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">JSON vào socket TCP</text><path d="M300,449 V470 H960 V493" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="640" y="464" text-anchor="middle" font-size="15" font-weight="400" font-style="italic" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" fill="#1a1a1a">MOVE, CHARGE_START, EXPLODE…</text><rect x="760.0" y="495" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="960" y="522" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">4. Luồng đọc của kết nối: đọc frame</text><text x="960" y="544" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">≤ 2048 ký tự, parse JSON</text><path d="M960,559 V576" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><path d="M960,578 L982,600 L960,622 L938,600 Z" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><path d="M982,600 H1184" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="1084" y="590" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">[seq ≤ lastSeq]</text><rect x="1186.0" y="568" width="188" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1280" y="595" text-anchor="middle" font-size="14" font-weight="400" fill="#1a1a1a">Trả ERROR</text><text x="1280" y="617" text-anchor="middle" font-size="14" font-weight="400" fill="#1a1a1a">DUPLICATE_SEQUENCE</text><path d="M1280,632 V666" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><circle cx="1280" cy="680" r="12" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><path d="M1272,672 L1288,688 M1288,672 L1272,688" stroke="#333333" stroke-width="1.5"/><path d="M960,622 V653" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="972" y="644" text-anchor="start" font-size="16" font-weight="400" fill="#1a1a1a">[seq &gt; lastSeq]</text><rect x="760.0" y="655" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="960" y="682" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">5. GameRoom.action() dưới khóa phòng:</text><text x="960" y="704" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">ghi hướng dx, dz; trả ACK</text><path d="M960,719 V743" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="760.0" y="745" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="960" y="772" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">6. Game loop mỗi 50 ms: di chuyển, va</text><text x="960" y="794" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">chạm, nhặt đồ, nổ bom; gửi event</text><path d="M960,809 V833" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="760.0" y="835" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="960" y="862" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">7. Mỗi 100 ms: snapshot riêng cho từng</text><text x="960" y="884" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">người xem, lọc theo SyncMode</text><path d="M960,899 V923" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="760.0" y="925" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="960" y="952" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">8. Đưa vào hàng đợi ghi; luồng ghi gửi</text><text x="960" y="974" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">qua socket ngoài khóa phòng</text><path d="M960,989 V1010 H300 V1033" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="640" y="1004" text-anchor="middle" font-size="15" font-weight="400" font-style="italic" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" fill="#1a1a1a">STATE_UPDATE, event, ACK</text><rect x="100.0" y="1035" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300" y="1062" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">9. Luồng đọc client: ReadLine(), đưa</text><text x="300" y="1084" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">vào inbox (gộp snapshot liền nhau)</text><path d="M300,1099 V1123" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><rect x="100.0" y="1125" width="400" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300" y="1152" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">10. Main thread lấy message khỏi inbox,</text><text x="300" y="1174" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">kiểm tra roomCode, roundIndex, phase</text><path d="M300,1189 V1206" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><path d="M300,1208 L322,1230 L300,1252 L278,1230 Z" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><path d="M322,1230 H518" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="412" y="1220" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">[sai phòng, sai vòng]</text><rect x="520.0" y="1198" width="160" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="600" y="1225" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">Bỏ qua</text><text x="600" y="1247" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">snapshot</text><path d="M600,1262 V1296" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><circle cx="600" cy="1310" r="12" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><path d="M592,1302 L608,1318 M608,1302 L592,1318" stroke="#333333" stroke-width="1.5"/><path d="M300,1252 V1283" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="312" y="1273" text-anchor="start" font-size="16" font-weight="400" fill="#1a1a1a">[hợp lệ]</text><rect x="90.0" y="1285" width="420" height="64" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300" y="1312" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">11. Áp dụng snapshot: sửa vị trí mình, nội</text><text x="300" y="1334" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">suy đối thủ, ẩn visible=false, HUD</text><path d="M300,1349 V1372 H60 V160 H274" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#open)"/><text x="180" y="1392" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">[khung hình kế tiếp]</text></svg>