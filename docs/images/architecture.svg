c" stroke="#2f8a46" stroke-width="2.5"/><text x="940.0" y="613" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933">Game loop</text><text x="940.0" y="647" text-anchor="middle" font-size="21" fill="#3e4c59">20 Hz, 1 luồng</text><path d="M455,505 V571" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="465" y="545" text-anchor="start" font-size="19" font-style="italic" fill="#1f2933">action</text><path d="M380,505 V535 H235 V571" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="307" y="527" text-anchor="middle" font-size="19" font-style="italic" fill="#1f2933">FIND_MATCH</text><path d="M280,635 H366" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="323" y="624" text-anchor="middle" font-size="19" font-style="italic" fill="#1f2933">tạo phòng</text><path d="M830,635 H764" fill="none" stroke="#1f2933" stroke-width="2.5" marker-end="url(#head)"/><text x="797" y="624" text-anchor="middle" font-size="19" font-style="italic" fill="#1f2933">tick</text><rect x="50" y="760" width="230" height="120" rx="10" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2.5"/><text x="165.0" y="798" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933">Không có DB</text><text x="165.0" y="832" text-anchor="middle" font-size="21" fill="#3e4c59">trạng thái trong</text><text x="165.0" y="860" text-anchor="middle" font-size="21" fill="#3e4c59">bộ nhớ</text><rect x="370" y="760" width="390" height="120" rx="10" fill="#f3ecfa" stroke="#7a4fb0" stroke-width="2.5"/><text x="565.0" y="798" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933">Snapshot 10 Hz</text><text x="565.0" y="832" text-anchor="middle" font-size="21" fill="#3e4c59">riêng cho từng người xem</text><text x="565.0" y="860" text-anchor="middle" font-size="21" fill="#3e4c59">roomCode + roundIndex</text><rect x="830" y="760" width="320" height="120" rx="10" fill="#f3ecfa" stroke="#7a4fb0" stroke-wi